<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BKID</title>
<script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#FAF9F5;color:#3D3929;font-family:Inter,Arial,sans-serif}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAF9F5}
.stage{position:absolute;left:120px;top:70px;width:1680px;height:790px;display:flex;flex-direction:column;gap:40px}
.stage>.h+*{margin-top:auto}.stage>*:last-child{margin-bottom:auto}
.chip{position:absolute;right:120px;top:66px;font:700 30px Inter,Arial,sans-serif;letter-spacing:1px;padding:10px 24px;border:3px solid #3D3929;border-radius:999px;background:#FFFFFF;color:#3D3929}
.chip.real{background:#3D3929;color:#FAF9F5}
.h{font:800 64px/1.1 Inter,Arial,sans-serif;letter-spacing:-1.5px;max-width:1260px}
.sub{font:500 36px/1.35 Inter,Arial,sans-serif;color:#6B6857}
.row{display:flex;gap:34px;align-items:stretch}
.col{display:flex;flex-direction:column;gap:22px}
.card{background:#FFFFFF;border:3px solid #E5E2D9;border-radius:22px;padding:32px 38px}
.card.focus{border-color:#D97757}
.lbl{font:700 30px Inter,Arial,sans-serif;color:#6B6857;letter-spacing:.5px}
.big{font:600 48px/1.3 Inter,Arial,sans-serif}
.body{font:500 38px/1.35 Inter,Arial,sans-serif}
.mark{background:#F6DCCF;border-bottom:6px solid #D97757;padding:0 10px;border-radius:8px}
.mono{font-family:'JetBrains Mono',Menlo,monospace}
.stamp{display:inline-block;font:800 40px Inter,Arial,sans-serif;color:#FFFFFF;padding:10px 30px;border-radius:12px;letter-spacing:2px}
.hold{background:#A3402A}.pass{background:#3E6B4C}
.term{background:#2B2A25;color:#F3F1EA;border-radius:20px;padding:32px 40px;font:500 33px/1.55 'JetBrains Mono',Menlo,monospace}
.term .ok{color:#9FD3A8}.term .bad{color:#E8A487}.term .dim{color:#B9B5A6}
.arrow{flex:0 0 auto;align-self:center;width:90px;height:8px;background:#3D3929;position:relative;border-radius:4px}
.arrow:after{content:"";position:absolute;right:-6px;top:-13px;border-left:26px solid #3D3929;border-top:17px solid transparent;border-bottom:17px solid transparent}
.tick{color:#3E6B4C;font-weight:800}.cross{color:#A3402A;font-weight:800}

.scene3{display:flex;gap:40px;align-items:center;margin-top:20px}.bub{position:relative;font:600 40px/1.3 Inter,Arial,sans-serif;max-width:470px}.bub:after{content:'';position:absolute;left:-26px;top:40px;border-right:30px solid #FFFFFF;border-top:18px solid transparent;border-bottom:18px solid transparent}.door{width:360px;height:450px;border:10px solid #3D3929;border-bottom:none;border-radius:150px 150px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding-bottom:20px;background:#FFFFFF}.outs{display:flex;flex-direction:column;gap:30px}.stamp,.lbl{white-space:nowrap}.out{display:flex;align-items:center;gap:20px;font:700 38px Inter,Arial,sans-serif}.x{position:absolute;right:24px;bottom:-34px;font:800 38px Inter,Arial,sans-serif}</style></head><body>
<div id="root" data-composition-id="BKID" data-start="0" data-duration="15.700" data-width="1920" data-height="1080">
<div id="scene" class="clip" data-start="0" data-duration="15.700" data-track-index="1">

<div class="stage">

<div class="h" id="hd">The idea, simply</div>
<div class="scene3">
  <div class="col" id="rb" style="align-items:center"><svg width="170" height="190" viewBox="0 0 170 190"><line x1="85" y1="6" x2="85" y2="34" stroke="#3D3929" stroke-width="8"/><circle cx="85" cy="10" r="10" fill="#D97757"/><rect x="14" y="34" width="142" height="112" rx="30" fill="#FFFFFF" stroke="#3D3929" stroke-width="8"/><circle cx="58" cy="88" r="13" fill="#3D3929"/><circle cx="112" cy="88" r="13" fill="#3D3929"/><rect x="56" y="114" width="58" height="10" rx="5" fill="#3D3929"/><rect x="40" y="152" width="90" height="34" rx="12" fill="#E5E2D9" stroke="#3D3929" stroke-width="6"/></svg><div class="lbl">robot helper</div></div>
  <div class="card bub" id="bub">“Sure! You can claim that after your trip.”<span class="stamp hold x" id="xw">wrong</span></div>
  <div class="door" id="door"><div id="bk"><svg width="200" height="130" viewBox="0 0 200 130"><path d="M100 18 Q60 0 10 10 V118 Q60 108 100 126 Z" fill="#FFFFFF" stroke="#3D3929" stroke-width="7"/><path d="M100 18 Q140 0 190 10 V118 Q140 108 100 126 Z" fill="#FFFFFF" stroke="#3D3929" stroke-width="7"/><line x1="28" y1="40" x2="84" y2="46" stroke="#E5E2D9" stroke-width="8"/><line x1="28" y1="64" x2="84" y2="70" stroke="#E5E2D9" stroke-width="8"/><line x1="116" y1="46" x2="172" y2="40" stroke="#D97757" stroke-width="8"/><line x1="116" y1="70" x2="172" y2="64" stroke="#E5E2D9" stroke-width="8"/></svg></div><div class="lbl" style="text-align:center">checker with<br>the rule book</div></div>
  <div class="outs">
    <div class="out" id="o1"><span class="stamp pass">goes out</span><span class="body">the book agrees</span></div>
    <div class="out" id="o2"><svg width="120" height="150" viewBox="0 0 120 150"><circle cx="60" cy="38" r="30" fill="#FFFFFF" stroke="#3D3929" stroke-width="8"/><path d="M12 146 Q12 78 60 78 Q108 78 108 146 Z" fill="#F6DCCF" stroke="#3D3929" stroke-width="8"/></svg><span class="body">a person looks first</span></div>
  </div>
</div>
</div></div></div>
<script>
const C={"robot": 2.083, "sure": 5.458, "wrong": 6.25, "checker": 7.875, "book": 11.25, "agrees": 12.292, "not": 13.625, "person": 14.0};
const tl=gsap.timeline({paused:true});
const IN=(s,t,v)=>tl.from(s,Object.assign({opacity:0,y:28,duration:.55,ease:'power3.out'},v||{}),t);
IN('#hd',.2);IN('#rb',C.robot-.3,{scale:.7,y:0,ease:'back.out(1.6)'});IN('#bub',C.sure-.6,{x:-40,y:0});IN('#xw',C.wrong,{scale:2,opacity:0,y:0,ease:'back.out(2)'});IN('#door',C.checker-.2,{y:60});IN('#bk',C.book,{scale:.5,y:0,ease:'back.out(1.8)'});IN('#o1',C.agrees-.2,{x:-40,y:0});IN('#o2',C.person-.6,{x:-40,y:0,ease:'expo.out'});
window.__timelines=window.__timelines||{};window.__timelines['BKID']=tl;
</script></body></html>
